####################################################################################################################
#                  FILAMENT HELPERS
####################################################################################################################

# Filament runout / change alias	
[gcode_macro M600]
gcode:
	LCDRGB R=0 G=0 B=1	# Turn LCD green
	PAUSE

[gcode_macro CHANGE_NOZZLE]
gcode:
     #Parameters
     {% set TEXT = "Change Nozzle"|string %}
     {% set probetmp = printer["gcode_macro MACROS_VARS"].probe_temp|default(0)%}

     DISPLAYTEXT TEXT="{TEXT}"
     C_HOME
     SET_TEMP HEATER="extruder" TEMP={probetmp}
     PARKFRONT

[gcode_macro LOAD_FILAMENT]
gcode:
	SAVE_GCODE_STATE NAME=LOADFILAMENT
	RELATIVE_EXTRUSION                                                                        
	G1 E35 F300
	RESTORE_GCODE_STATE NAME=LOADFILAMENT

[gcode_macro UNLOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=UNLOADFILAMENT
	RELATIVE_EXTRUSION                                                                     
	G1 E-70 F300                                                                                                                                     
	RESTORE_GCODE_STATE NAME=UNLOADFILAMENT


[gcode_macro HOT_LOAD]
gcode:
	# Parameters
	{% set t = params.T|default(240)|int %}
	
	SET_TEMP HEATER="extruder" TEMP={t}
	PARKPURGE
	SET_TEMP HEATER="extruder" TEMP={t} WAIT=1
    LOAD_FILAMENT

[gcode_macro HOT_UNLOAD]
gcode:
	# Parameters
	{% set t = params.T|default(240)|int %}
	
    SET_TEMP HEATER="extruder" TEMP={t}
	PARKPURGE
    SET_TEMP HEATER="extruder" TEMP={t} WAIT=1
    UNLOAD_FILAMENT


[gcode_macro FILAMENT_PURGE]
gcode:
  {% if printer.extruder.can_extrude|lower == 'true' %}
    RELATIVE_EXTRUSION
    RESET_EXTRUDER
    G1 E60 F300
    RESET_EXTRUDER
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}


# StandAlone cooling moves to extract proper filament tip
[gcode_macro FORM_TIP]
gcode:
    RELATIVE_EXTRUSION
    RESET_EXTRUDER
    G1 E-9.05 F1200
    G1 E0.68 F165
    G1 E0.70 F168
    G1 E0.73 F177
    G1 E0.78 F189
    G1 E0.82 F197
    G1 E0.84 F204
    G1 E0.90 F216
    G1 E0.97 F234
    G1 E1.02 F246
    G1 E1.04 F250
    G1 E-15.00 F6000.0
    G1 E-24.50 F5400.0
    G1 E-7.00 F2700.0
    G1 E-3.50 F1620.0
    G1 E20.00 F900.0
    G1 E-13 F500.0
    G1 E13 F400.0
    G1 E-11 F500.0
    G1 E11 F400.0
    G1 E-2.00 F50.0
    G1 E-4.00 F1200.0
    G1 E-4.00 F2000
    RESET_EXTRUDER


[gcode_macro PRIME_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=PRIME_NOZZLE_STATE
    M117 Priming
    G90                 ; Absolute coordinates.
    M83                 ; Relative extruder mode.
    G92 E0
    ; Move to start of line.
    G1 Z10 F900
    G1 Y3 X3 F18000
    G1 Z0.2 F900
    ; Print the line.
    G91                ; Relative coordinates.
    G1 X100 E25 F1000  ; Extrude filament 25mm (how much it retracted in PRINT_END).
    G1 Y-2 F1000
    G1 X-60 E9 F1000    ; Print second part of the line.
    G1 E-0.5 F3000      ; Retract to avoid stringing.
    G1 X0.5 E0 F1000    ; Wipe back to break string.
    G1 X-5.5 E0 F1000   ; Wipe forward to break string.
    RESTORE_GCODE_STATE NAME=PRIME_NOZZLE_STATE